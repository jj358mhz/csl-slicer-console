# =============================================================================
# Deploy to Utility Pi
# =============================================================================
# Triggered on every push to main, on pushing a version tag (so `git describe`
# resolves to a clean vN.N.N once the release tag lands after the merge), or
# manually via workflow_dispatch (e.g. `gh workflow run deploy.yml`).
# SSHes into the Utility Pi, pulls the latest commit, rebuilds and restarts
# the csl-slicer-console Docker container.

name: Deploy to Utility Pi

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# One deploy at a time. A release pushes main (merge) and then a tag within
# seconds; without this both runs `docker compose up` on the Pi at once and
# the second fails with a container-name conflict. Queue instead of cancel so
# the tag deploy still runs afterwards and picks up the clean `git describe`.
concurrency:
  group: deploy-utility-pi
  cancel-in-progress: false

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 2222
          script: |
            set -e
            cd ~/git/csl-slicer-console
            git fetch --tags --force
            git pull origin main
            export APP_VERSION="$(git describe --tags --always --dirty)"
            echo "Building version: $APP_VERSION"
            APP_VERSION="$APP_VERSION" docker compose up -d --build
            docker image prune -a -f --filter "label=app=csl-slicer-console" --filter "until=24h"
            echo "Deploy complete: $(git rev-parse --short HEAD) as $APP_VERSION"