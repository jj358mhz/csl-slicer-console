services:
  web:
    image: !reset null
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-5050}:5000"
    networks: !reset []
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      LOG_LEVEL: debug
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    entrypoint: []
    command: ["flask", "--app", "app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

networks: !reset {}