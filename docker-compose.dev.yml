services:
  csl-slicer-console:
    build:
      context: .
      dockerfile: Dockerfile
    image: csl-slicer-console:dev
    ports:
      - "${WEB_PORT:-5050}:5000"
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      LOG_LEVEL: debug
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    entrypoint: []
    command: ["flask", "--app", "app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

networks:
  web:
    external: false
    driver: bridge
    name: csl-slicer-console_web
