# =============================================================================
# csl-slicer-console — local self-hosted overlay
# =============================================================================
# For running your own instance outside the author's homelab: no dependency
# on the `auth-net` external network or a Caddy reverse proxy. Builds the
# production image and publishes it directly on a host port.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#   curl http://localhost:5050/health
#
# Every compose command for this instance needs both -f flags (stop, down,
# logs too); without them Compose uses the production file, which publishes
# no port and needs the external auth-net network.
# -----------------------------------------------------------------------------

services:
  csl-slicer-console:
    image: csl-slicer-console:local
    ports:
      - "${WEB_PORT:-5050}:5000"
    # Lets PLAYER_API_URL reach a local player through the host's published
    # port. Docker Desktop has this name already; Docker Engine on Linux doesn't.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  web:
    external: false
    driver: bridge
    name: csl-slicer-console_local
