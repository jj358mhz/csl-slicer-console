{# Slicer state badge. Rendered inline at page load; also re-rendered as an
   OOB fragment by the coalesced polling route. Callers that want the OOB
   variant include with `oob=True`. #}
{% set state_slug = (s.last_state or 'unknown') | lower | replace(' ', '') %}
<span id="badge-{{ s.id }}"
      class="badge badge--state badge--state--{{ state_slug }}"
      {%- if oob %} hx-swap-oob="true"{% endif %}>{{ s.last_state or 'unknown' }}</span>
