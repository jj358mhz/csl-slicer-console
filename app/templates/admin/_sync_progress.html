{# Progress panel for Sync buttons; static/js/sync_progress.js drives it. #}
<div id="sync-progress" class="modal" hidden>
  <div class="modal__backdrop"></div>
  <div class="modal__panel sync-progress" role="dialog" aria-modal="true" aria-labelledby="sync-progress-title">
    <h2 class="modal__title" id="sync-progress-title">Syncing accounts</h2>
    <p class="modal__body sync-progress__summary" id="sync-progress-summary" role="status"></p>
    <div class="sync-progress__track" id="sync-progress-overall" role="progressbar"
         aria-labelledby="sync-progress-title" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1">
      <div class="sync-progress__fill"></div>
    </div>
    <ul class="sync-progress__rows" id="sync-progress-rows"></ul>
    <div class="modal__actions">
      <button type="button" class="button button--primary" id="sync-progress-done" disabled>Done</button>
    </div>
  </div>
</div>
